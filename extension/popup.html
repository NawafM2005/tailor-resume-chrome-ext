<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: rgba(79, 70, 229, 0.12);
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-2: #f1f3f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --ok: #16a34a;
      --ok-soft: rgba(22, 163, 74, 0.12);
      --err: #dc2626;
      --err-soft: rgba(220, 38, 38, 0.12);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #818cf8;
        --primary-hover: #a5b4fc;
        --primary-soft: rgba(129, 140, 248, 0.18);
        --bg: #0b1020;
        --surface: #141a2e;
        --surface-2: #1c2338;
        --text: #e7eaf2;
        --text-muted: #94a3b8;
        --border: #273049;
        --ok: #4ade80;
        --ok-soft: rgba(74, 222, 128, 0.16);
        --err: #f87171;
        --err-soft: rgba(248, 113, 113, 0.16);
      }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      width: 380px;
      max-width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    .container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .logo svg { width: 19px; height: 19px; }

    .title-wrap { display: flex; flex-direction: column; }
    h1 { font-size: 15px; font-weight: 700; margin: 0; }
    .subtitle { font-size: 11px; color: var(--text-muted); }

    label.section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    textarea {
      width: 100%;
      height: 170px;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    textarea::placeholder { color: var(--text-muted); opacity: 0.8; }

    .row { display: flex; gap: 8px; }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      border: none;
      padding: 10px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s, transform 0.05s, opacity 0.15s;
    }
    button svg { width: 15px; height: 15px; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-secondary {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover:not(:disabled) { background: var(--surface-2); }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    /* Segmented mode selector */
    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
    }
    .segmented input { display: none; }
    .segmented label {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 4px;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, color 0.15s;
    }
    .segmented input:checked + label {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    /* Status */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      min-height: 18px;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
      display: none;
    }
    .status.busy .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .results { display: flex; flex-direction: column; gap: 6px; }
    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
    .chip.err { color: var(--err); background: var(--err-soft); border-color: transparent; }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .hidden { display: none !important; }

    footer { font-size: 10px; color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
      </div>
      <div class="title-wrap">
        <h1>Resume Tailor</h1>
        <span class="subtitle">Tailored PDFs for any job posting</span>
      </div>
    </header>

    <div class="row">
      <button id="btn-extract" class="btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Get Page Text
      </button>
      <button id="btn-clear" class="btn-secondary" title="Clear the job description">Clear</button>
    </div>

    <textarea id="job-text" placeholder="Paste the job description here, or click 'Get Page Text' to pull it from the current tab."></textarea>

    <div>
      <label class="section-label">What to generate</label>
      <div class="segmented" role="radiogroup" style="margin-top:6px;">
        <input type="radio" name="mode" id="mode-both" value="both" checked>
        <label for="mode-both">Both</label>
        <input type="radio" name="mode" id="mode-resume" value="resume">
        <label for="mode-resume">Resume</label>
        <input type="radio" name="mode" id="mode-cover" value="cover">
        <label for="mode-cover">Cover</label>
      </div>
    </div>

    <button id="btn-generate" class="btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4"></path><path d="m16.2 7.8 2.9-2.9"></path><path d="M18 12h4"></path>
        <path d="m16.2 16.2 2.9 2.9"></path><path d="M12 18v4"></path><path d="m4.9 19.1 2.9-2.9"></path>
        <path d="M2 12h4"></path><path d="m4.9 4.9 2.9 2.9"></path>
      </svg>
      <span id="generate-label">Generate Resume + Cover Letter</span>
    </button>

    <div id="status" class="status">
      <span class="spinner"></span>
      <span id="status-text">Ready.</span>
    </div>

    <div id="results" class="results hidden"></div>

    <footer>PDFs download with the same names each time, overwriting the old versions.</footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
